[package]
name = "nitori_io"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"

[features]
default = []
tokio = ["dep:tokio"]
futures = ["dep:futures-io"]

[dependencies]
tokio = { version = "1", default-features = false, optional = true }
futures-io = { version = "0.3.32", optional = true }
pin-project-lite = "0.2.17"
bytes = "1.12.1"
nitori_call = { path = "../nitori_call", features = ["bytes"] }
snafu = "0.9.2"
