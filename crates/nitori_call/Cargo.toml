[package]
name = "nitori_call"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"

[dependencies]
pin-project-lite.workspace = true
futures-core.workspace = true
nitori_call_macros.workspace = true

[features]
bytes = ["dep:bytes"]
# Run operations on values behind `tokio::sync::Mutex`; needs nightly.
tokio-sync = ["dep:tokio", "tokio/sync"]
# Run operations on values behind `futures::lock::Mutex`.
futures-lock = ["dep:futures-util", "futures-util/std"]

[dependencies.bytes]
workspace = true
optional = true

[dependencies.tokio]
workspace = true
optional = true

[dependencies.futures-util]
workspace = true
optional = true

[dev-dependencies]
bytes.workspace = true
nitori_io.workspace = true
tokio = { workspace = true, features = ["sync"] }
futures-util = { workspace = true, features = ["std"] }
