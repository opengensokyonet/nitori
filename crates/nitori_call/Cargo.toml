[package]
name = "nitori_call"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"

[dependencies]
pin-project-lite = "0.2.17"
futures-core = "0.3.32"
nitori_call_macros = { path = "../nitori_call_macros" }

[features]
bytes = ["dep:bytes"]

[dependencies.bytes]
version = "1.11"
optional = true

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["sync"] }
