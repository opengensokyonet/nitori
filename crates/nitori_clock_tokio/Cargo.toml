[package]
name = "nitori_clock_tokio"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"
description = "The nitori_clock monotonic clock of a tokio runtime"

[dependencies]
nitori_clock.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time"] }
