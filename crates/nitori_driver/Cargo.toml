[package]
name = "nitori_driver"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"
description = "A driver for the state of one connection, its calls and what it lends them"

[features]
default = ["std"]
# Call slots that are `Send`, so that a driver is `Send` when what it holds
# is: its components, calls, requests and keys, its clock and the parts'
# arguments.
std = ["nitori_call/std"]

[dependencies]
frunk_core.workspace = true
nitori_call.workspace = true
nitori_clock.workspace = true
nitori_driver_macros.workspace = true
snafu.workspace = true
