[workspace]
members = [
    "crates/nitori_call",
    "crates/nitori_call_macros",
    "crates/nitori_io",
    "examples/data-frame-codec",
]
resolver = "3"

[workspace.dependencies]
bytes = "1.12.1"
futures-core = "0.3.32"
futures-io = "0.3.32"
nitori_call = { path = "crates/nitori_call" }
nitori_call_macros = { path = "crates/nitori_call_macros" }
pin-project-lite = "0.2.17"
proc-macro2 = "1.0.107"
quote = "1.0.47"
snafu = { version = "0.9.2", git = "https://github.com/opengensokyonet/snafu", rev = "03cb8d2e52a3b0b33a39cc3d4ce8a7075fa4ab58" }
syn = { version = "2.0.119", features = ["full", "visit-mut", "extra-traits"] }
tokio = { version = "1", default-features = false }
